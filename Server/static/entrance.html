<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Войти в систему</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&display=swap"
          rel="stylesheet">
</head>
<body>
    <header class="header-container">
        <div class="header-style">
            <div>
                <a>WIKI</a>
            </div>
            <div class="nav">
                <a href="/home/index" target="_self">Главная</a>
                <a href="/home/about" target="_self">Правила</a>
                <a href="/home/characters" target="_self">Персонажи</a>
                <a href="/home/items" target="_self">Предметы</a>
                $if IsAdmin
                <a href="/admin/index" target="_self">Админ-панель</a>
                $endif
            </div>
            <div>
                <a class="icon" href="/auth/login" target="_self"><img src="images/user-round.svg">Профиль</a>
            </div>
        </div>
    </header>

    <main class="login-page">
    <div class="login-wrapper">
        <section class="login-panel">
            $if IsAdmin
                <h1>ВЫ УЖЕ ВОШЛИ В СИСТЕМУ</h1>
                <div class="live-form">
                    <form action="/auth/logout" method="post">
                        <button type="submit" class="login-button">
                            ВЫЙТИ ИЗ АККАУНТА
                        </button>
                    </form>
                </div>
            $else
                <h1>ВОЙТИ В СИСТЕМУ</h1>
                <form class="login-form" action="/auth/login" method="post">
                    <div class="login-input">
                        <a><img src="images/Key icon.svg"></a>
                        <input type="text" name="login" placeholder="ИМЯ ПОЛЬЗОВАТЕЛЯ / ЛОГИН" value="${Login}">
                    </div>
                    <span class="login-field-error">${LoginError}</span>
                    <div class="login-input">
                        <a><img src="images/Lock icon.svg"></a>
                        <input type="password" name="password" placeholder="ПАРОЛЬ / КЛЮЧ">
                    </div>
                    <span class="login-field-error">${PasswordError} ${AuthError}</span>
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>Запомнить меня</span>
                    </label>
                    <button type="submit" class="login-button">
                        ВОЙТИ
                    </button>
                </form>
            $endif
        </section>
    </div>

    <div class="login-links">
        <a href="#">Забыли пароль?</a>
    </div>

</main>
    
</body>
</html>
