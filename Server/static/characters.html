<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Персонажи</title>
    <link rel="shortcut icon" href="images/icon-zombie.png" type="image/x-icon">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header-container">
        <div class="header-style">
            <div>
                <a>WIKI</a>
            </div>
            <div class="nav">
                <a href="/home/index" target="_self">Главная</a>
                <a href="/home/about" target="_self">Правила</a>
                <a href="/home/characters" target="_self">Персонажи</a>
                <a href="/home/items" target="_self">Предметы</a>
                $if IsAdmin
                <a href="/admin/index" target="_self">Админ-панель</a>
                $endif
            </div>
            <div>
                <a class="icon" href="/auth/login" target="_self"><img src="images/user-round.svg">Профиль</a>
            </div>
        </div>
    </header>

    <main class="page-container">
        <h1 class="admin-title">Персонажи</h1>
        <div class="page-content">
            <section class="characters-grid" id="characters-grid" data-endpoint="/home/characters-filter">
            </section>

            <aside class="filter-panel">
                <h2>ФИЛЬТР</h2>
                <form action="/home/characters" method="get" id="characters-filter-form">
                    <label for="char-type">Тип персонажа</label>
                    <select id="char-type" name="char-type">
                        <option value="">---</option>
                        <option value="survivor">Выживший</option>
                        <option value="zombie">Монстр / Зомби</option>
                    </select>

                    <label for="ability">Специальная способность</label>
                    <select id="ability" name="ability">
                        <option value="">---</option>
                        <option value="hp-3">3 жизни</option>
                        <option value="hp-5">5 жизней</option>
                        <option value="normal">Обычный</option>
                        <option value="boss">Босс</option>
                    </select>

                    <button type="submit" class="filter-button">
                        <span>ФИЛЬТР</span>
                    </button>
                </form>
            </aside>
        </div>
    </main>

    <script src="scripts/filter.js"></script>
</body>

</html>
