<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&display=swap"
          rel="stylesheet">
</head>
<body>
    <header class="header-container">
        <div class="header-style">
            <div>
                <a>WIKI</a>
            </div>
            <div class="nav">
                <a href="index.html" target="_self">Главная</a>
                <a href="about.html" target="_self">Правила</a>
                <a href="characters.html" target="_self">Персонажи</a>
                <a href="items.html" target="_self">Предметы</a>
                <a href="admin.html" target="_self">Админ-панель</a>
            </div>
            <div>
                <a class="icon" href="entrance.html" target="_self"><img src="images/user-round.svg">Профиль</a>
            </div>
        </div>
    </header>

    <div class="page-container">
        <h1 class="admin-title">
            <span>Админ-панель</span>
        </h1>
        <div class="page-content">
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Тип</th>
                            <th>Особенности</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                    $foreach entity in model.Entities
                        <tr>
                            <td>${entity.Id}</td>
                            <td>${entity.Name}</td>
                            <td>${entity.Type}</td>
                            <td>${entity.Features}</td>
                            <td class="actions">
                                <a class="action-button" href="/admin/edit?id=${entity.Id}" aria-label="Редактировать">
                                    <img src="images/update.svg">
                                </a>
                                <form action="/admin/delete" method="post" style="display:inline;">
                                    <input type="hidden" name="id" value="${entity.Id}">
                                    <button type="submit" class="action-button" aria-label="Удалить">
                                        <img src="images/delete.svg">
                                    </button>
                                </form>
                            </td>
                        </tr>
                     $endfor
                    </tbody>
                </table>
            </div>

            <aside class="add-panel">
                <h2>Редактировать сущность</h2>
                <form action="/admin/update" method="post">
                    <input type="hidden" name="id" value="${Entity.Id}">

                    <label for="name">Имя</label>
                    <input type="text" id="name" name="name" value="${Entity.Name}">

                    <label for="type">Тип</label>
                    <select id="type" name="type">
                        <option value=""></option>
                        <option value="character">Персонаж</option>
                        <option value="monstr">Монстр</option>
                        <option value="weapon">Оружие</option>
                        <option value="things">Вещь</option>
                    </select>

                    <label for="characteristics">Особенности</label>
                    <input type="text" id="characteristics" name="characteristics" value="${Entity.Features}">

                    <button type="submit" class="add-button">
                        <span>СОХРАНИТЬ</span>
                    </button>
                </form>
            </aside>
        </div>

    </div>
</body>
</html>
