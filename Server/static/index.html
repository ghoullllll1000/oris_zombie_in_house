<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Зомби в доме</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&display=swap"
          rel="stylesheet">
</head>

<body>
    <header class="header-container">
        <div class="header-style">
            <div>
                <a>WIKI</a>
            </div>
            <div class="nav">
                <a href="/home/index" target="_self">Главная</a>
                <a href="/home/about" target="_self">Правила</a>
                <a href="/home/characters" target="_self">Персонажи</a>
                <a href="/home/items" target="_self">Предметы</a>
                $if IsAdmin
                <a href="/admin/index" target="_self">Админ-панель</a>
                $endif
            </div>
            <div>
                <a class="icon" href="/auth/login" target="_self"><img src="images/user-round.svg">Профиль</a>
            </div>
        </div>
    </header>

    <div class="shoulder-container">
        <div class="shoulder-style">
            <div>
                <div class="shoulder-a">
                    <a><img src="images/users-round.svg">2-5</a>
                    <a><img src="images/timer.svg">30+</a>
                    <a><img src="images/age.svg">12+</a>
                </div>
                <a href="/home/about" class="shoulder-button" style="text-decoration: none;">
                    <button type="button">
                        <span>ОБ ИГРЕ</span>
                    </button>
                </a>
            </div>
        </div>
    </div>

</body>

</html>
