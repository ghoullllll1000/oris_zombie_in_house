<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предметы</title>
    <link rel="shortcut icon" href="images/icon-zombie.png" type="image/x-icon">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header-container">
        <div class="header-style">
            <div>
                <a>WIKI</a>
            </div>
            <div class="nav">
                <a href="/home/index" target="_self">Главная</a>
                <a href="/home/about" target="_self">Правила</a>
                <a href="/home/characters" target="_self">Персонажи</a>
                <a href="/home/items" target="_self">Предметы</a>
                $if IsAdmin
                <a href="/admin/index" target="_self">Админ-панель</a>
                $endif
            </div>
            <div>
                <a class="icon" href="/auth/login" target="_self"><img src="images/user-round.svg">Профиль</a>
            </div>
        </div>
    </header>

    <main class="page-container">
        <h1 class="admin-title">ПРЕДМЕТЫ</h1>
        <div class="page-content">
            <section class="characters-grid">
                $if IsEmpty
                <p>Ничего не найдено</p>
                $endif
                
                $foreach weapon in Weapons
                <article class="character-card">
                    <div class="character-avatar">
                        <img src="${Image}" alt="${Name}">
                    </div>
                    <div class="character-info">
                        <h3>${Name}</h3>
                        <p>${Effect}</p>
                    </div>
                </article>
                $endfor

                $foreach item in Items
                <article class="character-card">
                    <div class="character-avatar">
                        <img src="${Image}" alt="${Name}">
                    </div>
                    <div class="character-info">
                        <h3>${Name}</h3>
                        <p>${Effect}</p>
                    </div>
                </article>
                $endfor
            </section>

            <aside class="filter-panel">
                <h2>ФИЛЬТР</h2>
                <form action="/home/items" method="get">
                    <label for="item-type">Тип предмета</label>
                    <select id="item-type" name="item-type">
                        <option value="">---</option>
                        <option value="weapon">Оружие</option>
                        <option value="things">Вещи</option>
                    </select>

                    <label for="item-ability">Категория / способность</label>
                    <select id="item-ability" name="item-ability">
                        <option value="">---</option>
                        <option value="melee">Холодное оружие</option>
                        <option value="firearm">Огнестрельное оружие</option>
                        <option value="explosive">Взрывчатка</option>
                        <option value="special">Специальное оружие</option>
                        <option value="health">Здоровье</option>
                        <option value="defense">Защита проёмов</option>
                        <option value="car">Машина</option>
                    </select>

                    <button type="submit" class="filter-button">
                        <span>ФИЛЬТР</span>
                    </button>
                </form>
            </aside>
        </div>
    </main>

    <script src="scripts/filter.js"></script>
</body>

</html>
