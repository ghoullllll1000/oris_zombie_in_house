services:
  postgres:
    image: postgres:18
    container_name: zombie_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234qwer!
      POSTGRES_DB: zombie_db
    ports:
      - "5777:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    
volumes:
  pgdata: